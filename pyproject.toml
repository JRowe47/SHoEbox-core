[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoebox-core"
version = "0.1.0"
description = "Sparse multiscale byte model with bounded memory and online local learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
shoebox-core = "shoebox_core.__main__:main"

[tool.setuptools]
packages = ["shoebox_core"]

[tool.setuptools.package-data]
shoebox_core = ["*.cpp", "*.hpp"]
